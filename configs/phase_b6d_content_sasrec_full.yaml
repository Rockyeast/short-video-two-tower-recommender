phase: phase-b6d-content-sasrec-full
scope:
  fit: canonical_big_train
  evaluate: reused_big_validation_development
  forbidden: [small_matrix, temporal_final, final_refit]
implementation:
  base_library: recbole
  base_model: SASRec
  version: 1.2.1
content:
  source: frozen_minilm_caption_embeddings
  fusion: warm_id_residual_plus_trainable_content_projection
  cold_item_id_residual: disabled
model:
  n_layers: 2
  n_heads: 2
  hidden_size: 64
  inner_size: 256
  hidden_dropout_prob: 0.5
  attn_dropout_prob: 0.5
  hidden_act: gelu
  layer_norm_eps: 1.0e-12
  initializer_range: 0.02
  loss_type: CE
training:
  seed: 20260725
  max_history: 50
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.0
  epochs: 5
evaluation:
  query_count: 6818
  fixed_catalog_count: 9365
  output_k: 100
  tie_break: ascending_item_id
selection:
  primary: Recall@100
  tie_break: NDCG@20
  final_tie_break: earliest_epoch
claims:
  one_configuration: true
  one_seed: true
  adaptive_validation_development: true
  sealed_test_claim: false
  significance_claim: false
  small_matrix_accessed: false
  temporal_final_accessed: false
