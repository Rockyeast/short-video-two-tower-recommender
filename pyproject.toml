[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "short-video-two-tower-recommender"
version = "0.0.1"
description = "Leakage-aware KuaiRec recommendation evaluation project"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.2.6",
  "pandas==2.3.3",
  "PyYAML==6.0.3",
  "scipy==1.16.3",
]

[project.optional-dependencies]
dev = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "lightgbm==4.6.0",
  "pydantic==2.12.5",
  "pytest==8.4.2",
  "scikit-learn==1.9.0",
  "uvicorn==0.35.0",
]
serving = [
  "fastapi==0.116.1",
  "pydantic==2.12.5",
  "uvicorn==0.35.0",
]
reranking = [
  "lightgbm==4.6.0",
]
sequential = [
  "recbole==1.2.1",
  "torch==2.11.0",
]
training = [
  "torch==2.11.0",
  "sentence-transformers==5.6.0",
]
benchmark = [
  "torch==2.11.0",
  "sentence-transformers==5.6.0",
  "faiss-cpu==1.14.3",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
